<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline — Nexmod</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    background: #08090b; color: #f2f4f7;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 2rem; text-align: center;
  }
  .mark {
    width: 44px; height: 44px; margin: 0 auto 1.75rem;
    display: grid; place-items: center; position: relative;
    background: #f2f4f7; color: #08090b; border-radius: 8px;
    font-weight: 800; font-size: 20px;
  }
  .mark::after { content:""; position:absolute; inset-inline:0; bottom:0; height:3px; background:#ff4a2e; }
  h1 { font-size: 1.5rem; margin: 0 0 .625rem; letter-spacing: -.02em; }
  p { color: #99a1ad; line-height: 1.65; margin: 0 auto 1.75rem; max-width: 34ch; }
  a {
    display: inline-block; padding: .8rem 1.4rem; border-radius: .5rem;
    background: #ff4a2e; color: #fff; font-weight: 600; text-decoration: none;
  }
  .tel { display:block; margin-top:1.25rem; color:#99a1ad; font-size:.875rem; text-decoration:none; }
  .tel strong { color:#f2f4f7; }
</style>
</head>
<body>
  <main>
    <div class="mark">N</div>
    <h1>You're offline</h1>
    <p>This page isn't cached yet. Reconnect and try again — pages you've already visited will still open.</p>
    <a href="javascript:location.reload()">Try again</a>
    <a class="tel" href="tel:+94757740404">Or call us on <strong>075 774 0404</strong></a>
  </main>
</body>
</html>
